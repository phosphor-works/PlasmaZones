$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'cpp'
layer: 'application'
stack: 'systems'
tags: ['cmake']

project:
  name: 'PlasmaZones'
  description: 'Window snapping, tiling and scrolling for KDE Plasma. Covers the daemon, editor, settings, KCM, KWin effect, bundled data and tests.'

tasks:
  # Tests in this tier read files of the phosphor-libs and phosphor-engine-libs
  # trees: test_pluau_helpers opens phosphor-tiles' pluau.luau from disk
  # (PHOSPHOR_SOURCE_DIR, the phosphor-engine-libs tree),
  # test_shader_schema_bounds reads the shader-family metadata schemas
  # (P_SHADER_SCHEMA_DIR), test_shader_item_qml_bindings sweeps
  # phosphor-surface-quick's shipped QML, and the shader gates compile every
  # bundled pack through phosphor-shaders and the pack registries, the surface
  # packs from the pinned phosphor-surface-packs tree. Those trees are the
  # commits cmake/PlasmaZonesDependencies.cmake pins, so the pin file is the
  # input that marks this tier affected when one moves. A workspace-relative input
  # (leading `/`) does that; task inputs merge with the inherited set rather than
  # replacing it.
  test:
    inputs:
      - '/cmake/PlasmaZonesDependencies.cmake'
